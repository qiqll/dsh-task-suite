<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="DSH Task Suite pipeline overview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Inter,Helvetica,Arial,sans-serif">
    <text x="56" y="70" fill="#67e8f9" font-size="13" font-weight="700" letter-spacing="2.2">DSH TASK SUITE</text>
    <text x="56" y="112" fill="#f8fafc" font-size="34" font-weight="750">DSH 任务流水线</text>
    <text x="56" y="148" fill="#94a3b8" font-size="16">主 Agent 只调度 · 后台 Worker 独立交付 · 机器验收，不采信自述</text>

    <!-- Column 1: conversation -->
    <g>
      <rect x="56" y="190" width="268" height="286" rx="16" fill="#111c31" stroke="#24324a"/>
      <text x="80" y="224" fill="#7dd3fc" font-size="12" font-weight="700" letter-spacing="1.2">01 / CONVERSATION</text>
      <text x="80" y="252" fill="#f1f5f9" font-size="17" font-weight="650">需求方 ↔ 主 Agent</text>
      <rect x="80" y="274" width="196" height="46" rx="10" fill="#1d2b44"/>
      <text x="94" y="294" fill="#cbd5e1" font-size="12">“给登录接口加限流”</text>
      <text x="94" y="310" fill="#64748b" font-size="11">task_add → P1 / 后端</text>
      <rect x="118" y="334" width="182" height="46" rx="10" fill="#0e7490" opacity="0.35" stroke="#164e63"/>
      <text x="132" y="354" fill="#e0f2fe" font-size="12">“已拆成 3 个任务，开始派活”</text>
      <text x="132" y="370" fill="#67e8f9" font-size="11">排期 · 派发 · 验收</text>
      <rect x="80" y="396" width="196" height="52" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <text x="94" y="416" fill="#94a3b8" font-size="11">主 Agent 不写业务代码</text>
      <text x="94" y="434" fill="#e2e8f0" font-size="12">只做决策与质量控制</text>
    </g>

    <!-- arrow 1 -->
    <g fill="#22d3ee">
      <path d="M336 332h26" stroke="#22d3ee" stroke-width="2"/>
      <path d="M360 327l10 5-10 5z" fill="#22d3ee" stroke="none"/>
    </g>

    <!-- Column 2: task pool -->
    <g>
      <rect x="376" y="190" width="300" height="286" rx="16" fill="#111c31" stroke="#24324a"/>
      <text x="400" y="224" fill="#a78bfa" font-size="12" font-weight="700" letter-spacing="1.2">02 / TASK POOL</text>
      <text x="400" y="252" fill="#f1f5f9" font-size="17" font-weight="650">磁盘上的 Markdown 任务池</text>
      <text x="400" y="272" fill="#64748b" font-size="11">.dsh/tasks/backlog.md · dev-progress.md</text>

      <g font-size="12">
        <rect x="400" y="288" width="252" height="38" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <rect x="408" y="300" width="7" height="14" rx="3" fill="#f59e0b"/>
        <text x="424" y="305" fill="#e2e8f0">T-101 给 /health 增加超时检查</text>
        <text x="424" y="319" fill="#f59e0b" font-size="10">进行中 · backend</text>

        <rect x="400" y="334" width="252" height="38" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <rect x="408" y="346" width="7" height="14" rx="3" fill="#22d3ee"/>
        <text x="424" y="351" fill="#e2e8f0">T-102 补一个失败用例并修复</text>
        <text x="424" y="365" fill="#22d3ee" font-size="10">待开始 · backend</text>

        <rect x="400" y="380" width="252" height="38" rx="8" fill="#0f172a" stroke="#1e293b"/>
        <rect x="408" y="392" width="7" height="14" rx="3" fill="#a3e635"/>
        <text x="424" y="397" fill="#e2e8f0">T-103 更新健康检查文档</text>
        <text x="424" y="411" fill="#a3e635" font-size="10">待验证 · docs</text>
      </g>
      <text x="400" y="446" fill="#94a3b8" font-size="11">人可以直接读、直接改</text>
      <text x="400" y="463" fill="#94a3b8" font-size="11">git 可选：普通目录走文件快照</text>
    </g>

    <!-- arrow 2 -->
    <g>
      <path d="M680 332h26" stroke="#22d3ee" stroke-width="2"/>
      <path d="M704 327l10 5-10 5z" fill="#22d3ee" stroke="none"/>
    </g>

    <!-- Column 3: worker -->
    <g>
      <rect x="720" y="190" width="270" height="286" rx="16" fill="#111c31" stroke="#24324a"/>
      <text x="744" y="224" fill="#f472b6" font-size="12" font-weight="700" letter-spacing="1.2">03 / WORKER</text>
      <text x="744" y="252" fill="#f1f5f9" font-size="17" font-weight="650">后台 subagent</text>
      <text x="744" y="272" fill="#64748b" font-size="11">全新上下文，独立完成一个任务</text>

      <rect x="744" y="290" width="222" height="44" rx="9" fill="#0f172a" stroke="#1e293b"/>
      <text x="758" y="309" fill="#e2e8f0" font-size="12">定向 → 风险判断 → 实施</text>
      <text x="758" y="324" fill="#94a3b8" font-size="10">不碰任务池状态</text>

      <rect x="744" y="342" width="222" height="44" rx="9" fill="#0f172a" stroke="#1e293b"/>
      <text x="758" y="361" fill="#e2e8f0" font-size="12">跑测试 → 提交 / 快照</text>
      <text x="758" y="376" fill="#94a3b8" font-size="10">输出结构化报告</text>

      <rect x="744" y="394" width="222" height="52" rx="9" fill="#2e1065" opacity="0.55" stroke="#7c3aed"/>
      <text x="758" y="414" fill="#ede9fe" font-size="12">“T-101 完成，测试通过”</text>
      <text x="758" y="431" fill="#c4b5fd" font-size="10">nonce · 改动文件 · 测试结果</text>
    </g>

    <!-- arrow 3 -->
    <g>
      <path d="M994 332h24" stroke="#22d3ee" stroke-width="2"/>
      <path d="M1016 327l10 5-10 5z" fill="#22d3ee" stroke="none"/>
    </g>

    <!-- Column 4: gate -->
    <g>
      <rect x="1030" y="190" width="194" height="286" rx="16" fill="#111c31" stroke="#24324a"/>
      <text x="1054" y="224" fill="#34d399" font-size="12" font-weight="700" letter-spacing="1.2">04 / GATE</text>
      <text x="1054" y="252" fill="#f1f5f9" font-size="17" font-weight="650">机器验收</text>
      <g font-size="11">
        <circle cx="1060" cy="278" r="4" fill="#34d399"/>
        <text x="1072" y="282" fill="#cbd5e1">重跑项目测试</text>
        <circle cx="1060" cy="302" r="4" fill="#34d399"/>
        <text x="1072" y="306" fill="#cbd5e1">基线 worktree 比对</text>
        <circle cx="1060" cy="326" r="4" fill="#34d399"/>
        <text x="1072" y="330" fill="#cbd5e1">改动归属 / 越界文件</text>
        <circle cx="1060" cy="350" r="4" fill="#34d399"/>
        <text x="1072" y="354" fill="#cbd5e1">测试是否被改弱</text>
        <circle cx="1060" cy="374" r="4" fill="#34d399"/>
        <text x="1072" y="378" fill="#cbd5e1">高风险路径审计</text>
      </g>
      <rect x="1054" y="398" width="142" height="44" rx="9" fill="#052e2b" stroke="#065f46"/>
      <text x="1068" y="417" fill="#a7f3d0" font-size="12" font-weight="700">通过 → 待验证</text>
      <text x="1068" y="433" fill="#6ee7b7" font-size="10">人工确认后归档</text>
    </g>

    <text x="56" y="522" fill="#475569" font-size="12">Markdown 文件 · git / 非 git 均可 · Better Sidebar 只读面板 · 不锁数据库</text>
    <text x="1224" y="522" fill="#475569" font-size="12" text-anchor="end">github.com/qiqll/dsh-task-suite</text>
  </g>
</svg>
