name: Feature request
description: 提一个具体的能力诉求或改进（不是 bug）
title: '[feat] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        说清「什么场景下、现在卡在哪、期望变成什么样」。想法阶段的讨论更适合 [Discussions](https://github.com/qiqll/dsh-task-suite/discussions)。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在做什么类型的项目、任务池怎么用（单步 / 自动循环 / 多工作区）
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 现在的痛点
      description: 现在的行为是什么、为什么不够用
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 具体到「输入什么、输出什么、什么算完成」最好
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 影响面
      options:
        - 只影响我自己的用法（配置 / 文档）
        - 会影响现有任务池格式
        - 会影响验收语义（task_accept / 自动验收）
        - 不确定
    validations:
      required: true
